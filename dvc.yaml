stages:
  prepare:
    cmd: python -m src.data.make_dataset data/raw/UCI_Credit_Card.csv 
      data/processed/
    deps:
    - data/raw/UCI_Credit_Card.csv
    - src/data/make_dataset.py
    - src/data/validation.py
    - src/features/build_features.py
    params:
    - prepare.random_state
    - prepare.test_size
    outs:
    - data/processed/test.csv
    - data/processed/train.csv
  train:
    cmd: python -m src.models.train
    deps:
    - data/processed/test.csv
    - data/processed/train.csv
    - src/features/build_features.py
    - src/models/pipeline.py
    - src/models/train.py
    params:
    - train.cv
    - train.learning_rate
    - train.max_depth
    - train.n_estimators
    - train.scoring
    outs:
    - artifacts/metrics.json
    - models/model.pkl
