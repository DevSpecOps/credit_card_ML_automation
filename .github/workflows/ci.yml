name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements.api.txt
          
      - name: Download Dataset
        run: python -m src.data.download
        
      - name: Data Validation (Pandera)
        run: |
          python -c "
          import pandas as pd
          from src.data.validation import validate_raw
          from src import config
          df = pd.read_csv(config.DATA_RAW).rename(columns={'default.payment.next.month': 'default_payment_next_month'})
          validate_raw(df)
          print('Data validation passed successfully.')
          "
          
      - name: Lint
        run: |
          flake8 src tests
          black --check src tests
          
      - name: Tests
        run: pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t credit_card_ml_automation:ci .