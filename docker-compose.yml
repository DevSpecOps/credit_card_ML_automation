services:
  api:
    build:
      context: .
      args:
        PYTHON_IMAGE: "mirror.gcr.io/library/python:3.12-slim"
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./monitoring_data:/app/monitoring_data
    environment:
      - MLFLOW_TRACKING_URI=sqlite:///mlflow.db
      - MONITORING_DB_PATH=/app/monitoring_data/monitoring.db
